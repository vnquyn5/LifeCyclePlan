spring:
  application:
    name: lifestyle-planner-backend
  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO

app:
  security:
    auth-rate-limit:
      max-tracked-buckets: 10000
      login-max-requests: 5
      login-window: 60s
      register-max-requests: 3
      register-window: 10m
