spring:
  application:
    name: lifestyle-planner-backend
  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation: INFO

app:
  security:
    auth-rate-limit:
      max-tracked-buckets: 10000
      login-max-requests: 5
      login-window: 60s
      register-max-requests: 3
      register-window: 10m
      refresh-max-requests: 30
      refresh-window: 60s

    jwt:
      issuer: ${JWT_ISSUER:lifecycleplan-backend}
      access-token-ttl: 15m
      refresh-token-ttl: 7d
      private-key-path: ${JWT_PRIVATE_KEY_PATH:./.local-secrets/jwt-private.pem}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:./.local-secrets/jwt-public.pem}
